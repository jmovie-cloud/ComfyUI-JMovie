[project]
name = "jmovie-cloud"
version = "0.1.0"
description = "Generate images, video and audio in ComfyUI with your JMovie account."
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11.8", "Pillow"]

[project.urls]
Repository = "https://github.com/jmovie-cloud/ComfyUI-JMovie"

[tool.comfy]
PublisherId = "jmovie-cloud"
DisplayName = "JMovie Cloud"
requires-comfyui = ">=0.36.0"
